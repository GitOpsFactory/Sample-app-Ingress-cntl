apiVersion: apps/v1
kind: Deployment
metadata:
  name: eks-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: eks-demo

  template:
    metadata:
      labels:
        app: eks-demo

    spec:
      containers:
      - name: eks-demo

        image: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/eks-demo:latest

        ports:
        - containerPort: 5000

        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 15

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"

          limits:
            memory: "512Mi"
            cpu: "500m"